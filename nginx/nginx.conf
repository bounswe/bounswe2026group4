# Redirect all HTTP traffic to HTTPS.
server {
    listen 80;
    server_name YOUR_DOMAIN;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name YOUR_DOMAIN;

    ssl_certificate     /etc/nginx/certs/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;

    # ── React SPA ─────────────────────────────────────────────────────────────
    # Unknown paths fall back to index.html so React Router handles them.
    root /usr/share/nginx/html;
    index index.html;
    location / {
        try_files $uri $uri/ /index.html;
    }

    # ── Django API ────────────────────────────────────────────────────────────
    # Strip the /api/ prefix before forwarding so Django's URL patterns are
    # unchanged and no existing tests need updating.
    location /api/ {
        rewrite ^/api/(.*)$ /$1 break;
        proxy_pass http://web:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ── Django static files (collectstatic output) ────────────────────────────
    location /static/ {
        alias /staticfiles/;
    }

    # ── User-uploaded media ───────────────────────────────────────────────────
    location /media/ {
        alias /media/;
    }
}
